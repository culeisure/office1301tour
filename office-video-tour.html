<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1301호 · 동영상 투어</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c18;color:#eef2ec;font:15px/1.6 'Malgun Gothic',sans-serif}main{max-width:1460px;margin:auto;padding:32px 32px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:2px;color:#b7c8bb}h1{font-size:26px;letter-spacing:-.6px;margin:3px 0 0;font-weight:500}.links{display:flex;gap:8px;flex-wrap:wrap}a,button{color:inherit;font:inherit;cursor:pointer;text-decoration:none;border:1px solid #405349;background:transparent;border-radius:7px;padding:9px 14px}a:hover,button:hover{background:#2d4439}a:focus-visible,button:focus-visible{outline:3px solid #d9c396;outline-offset:3px}.download{background:#e7e3d4;color:#26372c;border-color:#e7e3d4}.download:hover{background:#fff}.player{border:1px solid #36483f;border-radius:12px;overflow:hidden;box-shadow:0 20px 70px #0005;background:#000}video{width:100%;aspect-ratio:16/9;display:block}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}nav button{font-size:13px;color:#d6e1d7}nav button.active{color:#283b2f;background:#e7e3d4;border-color:#e7e3d4}nav small{color:#96a99c;margin-right:8px}nav button.active small{color:#617562}.meta{display:flex;justify-content:space-between;gap:20px;margin-top:18px;font-size:12px;color:#aabbb0}p{margin:0}#status{color:#d1dece}@media(max-width:720px){main{padding:20px 12px}header{align-items:flex-start;flex-direction:column;gap:14px}h1{font-size:22px}.links a{font-size:12px;padding:7px 10px}nav{gap:6px}nav button{font-size:12px;padding:8px 10px}.meta{flex-direction:column;gap:5px}.player{border-radius:7px}}
</style></head><body><main><header><div><div class="eyebrow">1301 · OFFICE TOUR</div><h1>사무실 동영상 투어</h1></div><div class="links"><a href="index.html">투어 홈</a><a href="office-360-tour.html">360° 둘러보기</a><a href="office-3d-tour.html">가구 배치 편집</a><a class="download" href="office-video-tour.mp4" download>MP4 저장</a></div></header><div class="player"><video id="film" controls playsinline preload="metadata" poster="img/video-poster.jpg">브라우저에서 재생되지 않으면 MP4 저장을 눌러 주세요.</video></div><nav aria-label="장면 이동"><button data-time="0" class="active"><small>01</small>홀 입구</button><button data-time="5"><small>02</small>업무 공간</button><button data-time="9.5"><small>03</small>이요한 자리</button><button data-time="14"><small>04</small>대표실</button><button data-time="18.5"><small>05</small>회의실</button><button data-time="23"><small>06</small>탕비실</button></nav><div class="meta"><p id="status">확정 배치 · 보유 가구 · 6개 장면</p><p>사진을 참고한 3D 모델입니다. 미실측 치수는 가정값입니다.</p></div></main><script>const film=document.getElementById('film'),buttons=[...document.querySelectorAll('[data-time]')];film.volume=0.85;buttons.forEach(b=>b.disabled=true);buttons.forEach(b=>b.onclick=()=>{film.currentTime=Number(b.dataset.time);film.play().catch(()=>{});});film.addEventListener('loadedmetadata',()=>{buttons.forEach(b=>b.disabled=false);document.getElementById('status').textContent=`${film.videoWidth} × ${film.videoHeight} · ${film.duration.toFixed(1)}초 · 배경음악 · 전환음`;});film.addEventListener('timeupdate',()=>{let selected=0;buttons.forEach((b,n)=>{if(film.currentTime>=Number(b.dataset.time))selected=n;});buttons.forEach((b,n)=>b.classList.toggle('active',n===selected));});film.addEventListener('error',()=>{document.getElementById('status').textContent='MP4 저장 버튼으로 영상을 내려받아 재생할 수 있습니다.';});async function loadFilm(){
 document.getElementById('status').textContent='영상을 준비하고 있습니다…';
 try {
  const source='office-video-tour.mp4';
  film.src=source+'?v=sound-20260915';
  film.load();
 }catch(e){document.getElementById('status').textContent='MP4 저장 버튼으로 영상을 내려받아 재생할 수 있습니다.';}
}loadFilm();</script></body></html>
