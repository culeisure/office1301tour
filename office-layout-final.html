        }else rect(i.x,i.y,i.w,i.h,{rx:i.kind==='chair'?.1:.025,fill:colors[i.kind],'fill-opacity':i.parent?.3:.19,stroke:bad.has(i.id)?'var(--red)':i.id===selected?'var(--foreground)':colors[i.kind],'stroke-width':(i.id===selected?2:1)/scale,'stroke-dasharray':uncertain?`${4/scale} ${3/scale}`:''},g);
        if(i.kind==='chair'){
          const back={0:[i.x+.08,i.y+i.h-.04,i.x+i.w-.08,i.y+i.h-.04],90:[i.x+.04,i.y+.08,i.x+.04,i.y+i.h-.08],180:[i.x+.08,i.y+.04,i.x+i.w-.08,i.y+.04],270:[i.x+i.w-.04,i.y+.08,i.x+i.w-.04,i.y+i.h-.08]}[i.rot||0];
          line(...back,{stroke:colors.chair,'stroke-width':3/scale},g);
        }
        if(i.kind==='fixed')rect(i.x+i.w-.65,i.y+.08,.5,.4,{rx:.06,fill:'none',stroke:'var(--muted-foreground)','stroke-width':1/scale},g);
        if(i.kind==='tall')for(let n=1;n<3;n++)line(i.x+i.w*n/3,i.y,i.x+i.w*n/3,i.y+i.h,{stroke:colors[i.kind]},g);
        const horizontal=i.w>=i.h;
        let fits=(horizontal?i.w:i.h)*scale>i.label.length*12+8;
        if(true){const cx=i.x+i.w/2;let cy=i.y+i.h/2;
          if(i.id==='P-T-01')cy=i.y-.15;
          if(i.id==='TV-S-01')cy=i.y+i.h-.07;
          if(i.id==='S-C1-05')cy=i.y-.17;
          
          
          if(i.kind==='ceo')cy=i.y+.4;
          if(i.kind==='fixed')cy=i.y+i.h+.17;
          const label=i.label;
          const available=(horizontal?i.w:i.h)*scale-5;
          const count=Math.max(2,Math.floor(available/11));
          const chunks=[];for(let n=0;n<label.length;n+=count)chunks.push(label.slice(n,n+count));
          const t=text(cx,cy,'',11,{transform:!horizontal&&i.kind!=='ceo'?`rotate(-90 ${cx} ${cy})`:'','pointer-events':'none'},g);
          chunks.forEach((chunk,n)=>{const span=el('tspan',{x:cx,y:cy+(n-(chunks.length-1)/2)*12/scale},t);span.textContent=chunk;});
        }
        if(i.kind==='ceo'&&scale>40){text(i.x+.27,i.y+1.6,'측면 수납장',12,{transform:`rotate(-90 ${i.x+.27} ${i.y+1.6})`},g);}
        if(false)text(i.x+i.w/2,i.y+i.h-.16,'이요한 자리',12,{},g);
        if(false)text(i.x+i.w/2,i.y+i.h-.16,'싱크대 앞 약 550mm',12,{},g);
        g.addEventListener('pointerdown',e=>{
          if(e.button!==0)return;selected=i.id;updateControls();
          if(i.locked){draw();return;}
          const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
          drag={id:i.id,dx:q.x-i.x,dy:q.y-i.y};e.preventDefault();draw();
        });
      }
      // Attached screens follow their assigned desks rather than occupying extra floor area.
      for(const a of data.attached){const p=items.find(i=>i.id===a.parent);if(a.id.startsWith('F-')){if(p.chair==='left'||p.chair==='right'){const x=p.x+(p.chair==='left'?p.w:0);line(x,p.y,x,p.y+p.h,{stroke:'var(--foreground)','stroke-width':2/scale});}else line(p.x,p.y+(p.chair==='top'?p.h:0),p.x+p.w,p.y+(p.chair==='top'?p.h:0),{stroke:'var(--foreground)','stroke-width':2/scale});}else line(p.x,p.y,p.x+p.w,p.y,{stroke:'var(--foreground)','stroke-width':2/scale});}
      // Room tags sit in reserved gaps, clear of furniture labels.
      if(scale>40){
        text(1.6,.72,'대표실 · 벽을 등지고 문 방향',12);text(1.55,4.72,'회의실',13);
        text(1.55,8.12,'직원방 · 5석',13);text(1.1,13.95,'창고',12);
        
        text(5.8,1.02,'탕비실 · 싱크대 존치',12);
        text(4.55,2.68,'책장 3개',12,{'text-anchor':'start'});
        
        
        
        const c=data.ceoChair;
        line(c.x+c.w/2,c.y-.1,c.x+c.w/2,c.y-.32,{stroke:'var(--viz-series-2)','stroke-width':2/scale});
        el('path',{d:`M${c.x+c.w/2-.06} ${c.y-.25} L${c.x+c.w/2} ${c.y-.34} L${c.x+c.w/2+.06} ${c.y-.25}`,fill:'none',stroke:'var(--viz-series-2)','stroke-width':2/scale});
      }
      const low=[];if(warn.pairs.length)low.push('가구 몸체 겹침: '+warn.pairs.map(a=>a.map(k=>items.find(i=>i.id===k)?.label||k).join(' / ')).join(', '));if(warn.walls.length)low.push('벽 통과·외곽 이탈: '+warn.walls.map(k=>items.find(i=>i.id===k)?.label||k).join(', '));
      if(warn.obstacleHits.length)low.push('기둥 검토 띠와 겹침 · 실측 후 이동: '+warn.obstacleHits.join(', '));
      if(warn.aisleHits.length)low.push('중간 통로 침범: '+warn.aisleHits.map(k=>{const id=k.replace(' 의자 영역','');return (items.find(i=>i.id===id)?.label||id)+(k.endsWith(' 의자 영역')?' 의자 영역':'')}).join(', '));
      const rearTight=items.filter(i=>i.room.startsWith('홀')&&i.chair==='bottom'&&14.45-(i.y+i.h+.66)<.6);
      if(rearTight.length){
        for(const i of rearTight){const c=chairPosition(i);rect(c[0]-.33,c[1]-.33,.66,.66,{rx:.06,fill:'none',stroke:'var(--red)','stroke-width':1/scale,'stroke-dasharray':`${4/scale} ${3/scale}`});}
        if(scale>40)text(6.65,14.35,'! 마지막 줄 의자 뒤 여유 부족',12,{fill:'var(--red)'});
      }
      $('status').textContent=low.length?low.join(' · '):'사용자 지정 배치 · '+(rearTight.length?'마지막 줄 의자 뒤 여유 부족 · ':'')+'가구를 선택해 위치를 수정할 수 있습니다';
      $('status').classList.toggle('text-destructive',low.length>0);
      updateControls();
      root.layoutData=data;
    }
    function moveItem(i,x,y){const dx=x-i.x,dy=y-i.y;i.x=x;i.y=y;for(const child of items.filter(c=>c.parent===i.id)){child.x+=dx;child.y+=dy;}if(i.id==='C-D-01'){data.ceoChair.x+=dx;data.ceoChair.y+=dy;}}
    function movePointer(e){if(!drag||!svg)return;const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const i=items.find(a=>a.id===drag.id);moveItem(i,Math.round((q.x-drag.dx)*20)/20,Math.round((q.y-drag.dy)*20)/20);e.preventDefault();draw();}
    document.addEventListener('pointermove',movePointer,{passive:false});document.addEventListener('pointerup',()=>drag=null);document.addEventListener('pointercancel',()=>drag=null);
    $('item').innerHTML=items.map(i=>`<option value="${esc(i.id)}">${esc(i.label)} · ${esc(i.room)}</option>`).join('');
    $('notes').innerHTML=data.notes.map(n=>`<li>${esc(n)}</li>`).join('');
    $('item').addEventListener('change',()=>{selected=$('item').value;draw();});
    for(const k of ['x','y'])$(k).addEventListener('change',()=>{const val=Number($(k).value);if(!Number.isFinite(val))return;const i=getItem();moveItem(i,k==='x'?val/1000:i.x,k==='y'?val/1000:i.y);draw();});
    $('view').addEventListener('change',draw);$('chairs').addEventListener('change',draw);
    root.querySelector('[data-action="rotate"]').addEventListener('click',()=>{
      const i=getItem(),cx=i.x+i.w/2,cy=i.y+i.h/2,ow=i.w,oh=i.h;
      if(i.locked)return;
      if(i.id==='C-D-01'){const c=data.ceoChair,dx=c.x+c.w/2-cx,dy=c.y+c.h/2-cy,cw=c.w,ch=c.h;c.w=ch;c.h=cw;c.x=cx-dy-ch/2;c.y=cy+dx-cw/2;}
      for(const c of items.filter(c=>c.parent===i.id)){
        const dx=c.x+c.w/2-cx,dy=c.y+c.h/2-cy,cw=c.w,ch=c.h;c.w=ch;c.h=cw;c.x=cx-dy-ch/2;c.y=cy+dx-cw/2;c.rot=(c.rot+90)%360;
      }
      if(i.parts)i.parts=i.parts.map(p=>({x:1-p.y-p.h,y:p.x,w:p.h,h:p.w}));
      i.w=oh;i.h=ow;i.x=cx-oh/2;i.y=cy-ow/2;i.rot=(i.rot+90)%360;
      if(i.chair)i.chair={top:'right',right:'bottom',bottom:'left',left:'top'}[i.chair];draw();
    });
    new ResizeObserver(draw).observe($('map'));draw();
    root.exportSvg=()=>new XMLSerializer().serializeToString(svg);
  })();
  </script>
</div>

<div class="export-row"><button class="btn" id="save-layout">수정한 배치 저장</button><label class="btn">저장한 배치 불러오기<input type="file" id="load-layout" accept="application/json" hidden></label><span class="save-info">변경 내용은 저장 버튼으로 보관합니다.</span></div>
<div class="foot text-small">확정본 · 사용자가 지정한 최종 배치 기준 · 실측·시공 확정용 도면 아님</div>
</main><script>
const root=document.getElementById('office-plan-final');
document.getElementById('save-layout').onclick=()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(root.layoutData,null,2)],{type:'application/json'}));a.href=url;a.download='office-layout-edited.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('load-layout').onchange=async e=>{try{const incoming=JSON.parse(await e.target.files[0].text());if(!Array.isArray(incoming.items))throw new Error('배치 데이터가 아닙니다.');for(const dest of root.layoutData.items){const src=incoming.items.find(x=>x.id===dest.id);if(!dest.locked&&src&&['x','y','w','h'].every(k=>Number.isFinite(src[k]))&&src.w>0&&src.h>0){for(const k of ['x','y','w','h','rot','chair','parts'])if(k in src)dest[k]=src[k];}}if(incoming.ceoChair&&['x','y','w','h'].every(k=>Number.isFinite(incoming.ceoChair[k])))root.layoutData.ceoChair={...incoming.ceoChair};root.querySelector('[data-field="view"]').dispatchEvent(new Event('change'));}catch(err){alert('파일을 불러오지 못했습니다: '+err.message);}e.target.value='';};
</script></body></html>
