<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>1301호 사무실 배치도 · 버전 선택</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#253b3a;background:#f0f3ef;font:14px/1.5 'Malgun Gothic',Arial,sans-serif}.bar{height:104px;padding:13px 24px;background:#fff;border-bottom:1px solid #d5dfda;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand small{font-size:10px;letter-spacing:.15em;color:#658474}.brand h1{font-size:18px;margin:2px 0}.brand p{margin:0;color:#718077;font-size:11px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:4px;background:#eef2ed;padding:4px;border-radius:9px}button,a{font:inherit;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;white-space:nowrap}button{background:transparent;color:#526c60}button[aria-selected=true]{background:#253b3a;color:white}a{color:#456759;text-decoration:none;border:1px solid #d5dfda;font-size:12px}a:hover{background:#f0f3ef}.pane{height:calc(100dvh - 104px)}iframe{display:block;width:100%;height:100%;border:0;background:white}[hidden]{display:none!important}.hint{font-size:11px;color:#7c887e}.downloads{display:flex;gap:5px}@media(max-width:800px){.bar{height:145px;display:block;padding:10px 12px}.brand h1{font-size:16px}.brand p{display:none}.brand{margin-bottom:8px}.controls{gap:6px;justify-content:space-between}.tabs button{font-size:12px;padding:8px}.downloads a{padding:7px 9px;font-size:11px}.hint{display:none}.pane{height:calc(100dvh - 145px)}}
</style></head><body>
<header class="bar"><div class="brand"><small>OFFICE 1301</small><h1>사무실 가구 배치도</h1><p>원래 확정본과 최신 배치를 비교해 보세요.</p></div><div class="controls"><div class="tabs" role="tablist" aria-label="배치도 버전"><button id="tab-v2" role="tab" aria-selected="true" aria-controls="pane-v2">버전 2 · 최신</button><button id="tab-v1" role="tab" aria-selected="false" aria-controls="pane-v1">버전 1 · 원래 확정본</button></div><div class="downloads"><a id="image-link" href="v2-layout.png" target="_blank" rel="noopener">도면 이미지</a><a id="pdf-link" href="v2-layout.pdf" target="_blank" rel="noopener">PDF</a><a id="data-link" href="v2-layout.json" download>JSON</a></div><span class="hint">수정한 배치는 도면 안의 저장 버튼으로 보관</span></div></header>
<section id="pane-v2" class="pane" role="tabpanel" aria-labelledby="tab-v2"><iframe id="frame-v2" title="버전 2 최신 배치도" src="v2.html"></iframe></section>
<section id="pane-v1" class="pane" role="tabpanel" aria-labelledby="tab-v1" hidden><iframe id="frame-v1" title="버전 1 원래 확정 배치도" src="v1.html"></iframe></section>
<script>
function selectVersion(version){if(!['v1','v2'].includes(version))version='v2';for(const v of ['v1','v2']){document.getElementById('pane-'+v).hidden=v!==version;document.getElementById('tab-'+v).setAttribute('aria-selected',String(v===version));}document.getElementById('image-link').href=version+'-layout.png';document.getElementById('data-link').href=version+'-layout.json';document.getElementById('pdf-link').hidden=version==='v1';history.replaceState(null,'','#'+version);}
for(const v of ['v1','v2'])document.getElementById('tab-'+v).onclick=()=>selectVersion(v);selectVersion(location.hash.slice(1)||'v2');window.addEventListener('hashchange',()=>selectVersion(location.hash.slice(1)));document.querySelector('.tabs').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const v=document.getElementById('tab-v2').getAttribute('aria-selected')==='true'?'v1':'v2';selectVersion(v);document.getElementById('tab-'+v).focus();e.preventDefault();}});
</script></body></html>
