<script>
const revisions={v1:'',v2:'a9eff3d821e8',v3:'f5ec90d14dce'}, versions=['v3','v2','v1'];
function selectVersion(version){if(!versions.includes(version))version='v3';for(const v of versions){document.getElementById('pane-'+v).hidden=v!==version;document.getElementById('tab-'+v).setAttribute('aria-selected',String(v===version));}const query=revisions[version]?'?v='+revisions[version]:'';document.getElementById('image-link').href=version+'-layout.png'+query;document.getElementById('data-link').href=version+'-layout.json'+query;document.getElementById('data-link').download=version+'-layout.json';document.getElementById('pdf-link').href=version+'-layout.pdf'+query;document.getElementById('pdf-link').hidden=version==='v1';history.replaceState(null,'','#'+version);}
